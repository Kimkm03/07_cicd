<text x="74" y="570" font-size="12.5" font-weight="400" fill="#3d4450" text-anchor="start">우리WON 전체 상황판</text>
<text x="74" y="588" font-size="12.5" font-weight="400" fill="#3d4450" text-anchor="start">  서버 수 · 초당 요청 · 평균 응답 시간</text>
<text x="74" y="606" font-size="12.5" font-weight="400" fill="#3d4450" text-anchor="start">  평균 CPU · 힙 · DB 연결(기다리는 요청)</text>
