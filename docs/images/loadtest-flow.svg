<text x="94" y="194" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">k6 (docker grafana/k6)</text>
<text x="74" y="214" font-size="12.5" font-weight="400" fill="#3d4450" text-anchor="start">가상 클라이언트 10명 → 50명</text>
<text x="74" y="232" font-size="12.5" font-weight="400" fill="#3d4450" text-anchor="start">회원 2명 만들고 입금한 뒤</text>
<text x="74" y="250" font-size="12.5" font-weight="400" fill="#3d4450" text-anchor="start">"계좌 목록 → 10원 이체" 를 반복</text>
<text x="74" y="268" font-size="12.5" font-weight="400" fill="#3d4450" text-anchor="start">HOLD=8m  (경보 5분 + 새 서버 3분)</text>
<rect x="62" y="344" width="364" height="126" rx="8" fill="#fff" stroke="#ed7100" stroke-width="1.4"/>
<text x="74" y="366" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">Prometheus :9090</text>
<text x="74" y="386" font-size="12.5" font-weight="400" fill="#3d4450" text-anchor="start">5초마다 서버마다 /actuator/prometheus</text>
<text x="74" y="404" font-size="12.5" font-weight="400" fill="#3d4450" text-anchor="start">서버 목록은 EC2 API 에 물어봄</text>
<text x="74" y="422" font-size="12.5" font-weight="400" fill="#3d4450" text-anchor="start">(ASG 꼬리표, 30초마다) → 늘어도 자동</text>
