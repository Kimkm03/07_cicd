<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','WenQuanYi Zen Hei',sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2f36"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8290"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker></defs><rect width="1600" height="1060" fill="#ffffff"/><text x="28" y="40" font-size="24" font-weight="700" fill="#1f2328" text-anchor="start">부하 테스트: k6 로 몰고, CloudWatch 경보가 서버 수를 바꾼다</text>
<text x="28" y="64" font-size="13.5" font-weight="400" fill="#3d4450" text-anchor="start">k6 는 모니터링 EC2 에서 ALB 로 직접 요청합니다. 숫자는 두 갈래로 모입니다: 서버 안쪽(Prometheus → Grafana), 서버 바깥(ALB → CloudWatch → 경보 → Auto Scaling).</text>
<rect x="24" y="90" width="1552" height="640" rx="10" fill="#fcfaff" stroke="#8c4fff" stroke-width="1.6"/>
